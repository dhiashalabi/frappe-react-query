name: CI

on:
    pull_request:
        branches:
            - develop
            - master

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v1
              with:
                  runtime: node@20
                  cache: true
                  install: false

            - name: Install dependencies 📥
              run: pnpm install --frozen-lockfile
              env:
                  HUSKY: '0'

            - name: Check formatting
              run: pnpm exec prettier --check .

            - name: Run linting 🔍
              run: pnpm lint

            - name: Run tests 🧪
              run: pnpm test

            - name: Build package 🔨
              run: pnpm build
